<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Personajes</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- 1. Header con título principal y subtítulo descriptivo -->
  <header>
    <h1>Explorador de Personajes</h1>
    <p>Descubre y explora la lista de personajes obtenidos desde la API</p>
  </header>

  <main>
    <!-- 2. Section de controles con botón -->
    <section id="controles">
      <button id="btn-cargar" type="button">Cargar Personajes</button>
    </section>

    <!-- 3. Section de loading (oculto por defecto) -->
    <section id="loading" hidden aria-live="polite">
      <div class="spinner" role="status"></div>
      <p>Cargando personajes...</p>
    </section>

    <!-- 4. Div para mensajes de error (oculto por defecto) -->
    <div id="mensaje-error" hidden role="alert"></div>

    <!-- 5. Section para mostrar los personajes -->
    <section id="contenedor-personajes" aria-label="Lista de personajes">
      <!-- Las tarjetas de los personajes se agregarán dinámicamente desde JS -->
    </section>
  </main>

  <!-- 6. Footer con enlace a la documentación de la API -->
  <footer>
    <p>
      Documentación oficial: 
      <a href="https://thesimpsonsapi.com" target="_blank" rel="noopener noreferrer">
        The Simpsons API Documentation
      </a>
    </p>
  </footer>

  <!-- 7. Script tag importado como módulo -->
  <script type="module" src="./dist/main.js"></script>

</body>
</html>
